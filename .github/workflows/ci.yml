name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app.py worker.py aggregator.py dashboard.py core.py saas.py integrations.py billing.py knowledge.py tenant_policy.py
      - run: pytest -q --cov=. --cov-report=term-missing
      - run: pip-audit -r requirements.txt
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: leadlens:ci }