services:
  leadlens:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./policies:/service/policies:ro
      - ./data/chroma:/service/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3